<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ride Brain</title><style>
body{font-family:system-ui;background:#101418;color:#f5f7f8;max-width:900px;margin:auto;padding:24px}h1{font-size:2rem}section{background:#192127;border:1px solid #33414a;border-radius:14px;padding:18px;margin:16px 0}label{display:block;margin:10px 0 4px;color:#b8c4ca}input,textarea,button{box-sizing:border-box;width:100%;padding:11px;border-radius:8px;border:1px solid #52636d;background:#0f1519;color:white}button{background:#d7ff38;color:#101418;font-weight:700;cursor:pointer;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}pre{white-space:pre-wrap;color:#d7ff38}.muted{color:#9aabb4}
</style></head><body><h1>Ride Brain</h1><p class="muted">Your Garmin history, schedule and live ride model in one place. <a href="/phone" style="color:#d7ff38">Open iPhone view</a></p>
<section><h2>Connection</h2><div class="grid"><div><label>Rider ID</label><input id="rider" value="thomas"></div><div><label>Phone pairing token (only needed away from this PC)</label><input id="token" type="password"></div></div><button onclick="loadProfile()">Load learned profile</button><pre id="profile">Not loaded</pre></section>
<section><h2>Life and recovery context</h2><div class="grid"><div><label>Sleep last night (hours)</label><input id="sleep" type="number" value="7"></div><div><label>Night shift</label><input id="shift" type="checkbox"></div><div><label>Training time available (minutes)</label><input id="minutes" type="number" value="90"></div></div><label>Work schedule / availability / constraints</label><textarea id="schedule"></textarea><button onclick="saveContext()">Save context</button></section>
<section><h2>Ask your coach</h2><textarea id="question">What training or recovery should I do today?</textarea><button onclick="plan()">Get recommendation</button><pre id="answer"></pre></section>
<script>
const auth=()=>({Authorization:`Bearer ${token.value}`,'X-Companion-Local':'1','Content-Type':'application/json'});const show=(id,v)=>document.getElementById(id).textContent=JSON.stringify(v,null,2);
async function call(path,init={}){const r=await fetch(path,{...init,headers:auth()});const j=await r.json();if(!r.ok)throw Error(j.error);return j}
async function loadProfile(){try{show('profile',await call(`/v1/profile?rider_id=${encodeURIComponent(rider.value)}`))}catch(e){show('profile',{error:e.message})}}
async function saveContext(){try{show('answer',await call('/v1/context',{method:'POST',body:JSON.stringify({rider_id:rider.value,sleep_hours:+sleep.value,night_shift:shift.checked,available_minutes:+minutes.value,schedule:schedule.value})}))}catch(e){show('answer',{error:e.message})}}
async function plan(){try{show('answer',await call('/v1/plan',{method:'POST',body:JSON.stringify({rider_id:rider.value,question:question.value})}))}catch(e){show('answer',{error:e.message})}}
</script></body></html>
